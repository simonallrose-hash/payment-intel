# Detection rules for provider `clover` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: clover
source: https://docs.clover.com/docs/using-the-clover-hosted-iframe
rules:
- id: provider.clover.script_src.1
  version: 1
  signal_type: script_src
  pattern: checkout.clover.com/sdk.js
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.clover.js_global.1
  version: 1
  signal_type: js_global
  pattern: Clover
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.clover.network_host.1
  version: 1
  signal_type: network_host
  pattern: checkout.clover.com
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.clover.network_host.2
  version: 1
  signal_type: network_host
  pattern: checkout.sandbox.dev.clover.com
  weight: 0.2
  page_scope: any
  enabled: true
  note: sandbox
