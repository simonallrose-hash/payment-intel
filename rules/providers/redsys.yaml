# Detection rules for provider `redsys` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: redsys
source: https://pagosonline.redsys.es/
rules:
- id: provider.redsys.network_host.1
  version: 1
  signal_type: network_host
  pattern: sis.redsys.es
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.redsys.network_host.2
  version: 1
  signal_type: network_host
  pattern: sis-t.redsys.es
  weight: 0.2
  page_scope: any
  enabled: true
  note: test
- id: provider.redsys.network_host.3
  version: 1
  signal_type: network_host
  pattern: '*.redsys.es'
  weight: 0.4
  page_scope: any
  enabled: true
- id: provider.redsys.script_src.1
  version: 1
  signal_type: script_src
  pattern: sis.redsys.es/sis/NC/redsysV3.js
  weight: 0.6
  page_scope: any
  enabled: false
  needs_verification: true
  note: inSite iframe script
