# Detection rules for provider `nmi` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: nmi
source: https://docs.nmi.com/docs/quick-start-tutorial
rules:
- id: provider.nmi.script_src.1
  version: 1
  signal_type: script_src
  pattern: secure.nmi.com/token/Collect.js
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.nmi.js_global.1
  version: 1
  signal_type: js_global
  pattern: CollectJS
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.nmi.network_host.1
  version: 1
  signal_type: network_host
  pattern: secure.nmi.com
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.nmi.iframe_src.1
  version: 1
  signal_type: iframe_src
  pattern: secure.nmi.com
  weight: 0.6
  page_scope: checkout
  enabled: true
