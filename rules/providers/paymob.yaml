# Detection rules for provider `paymob` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: paymob
source: 'https://docs.paymob.com/docs/iframes; verified: https://developers.paymob.com/egypt/api-reference-guide/pixel-native-payment-experience and https://developers.paymob.com/paymob-docs/developers/checkout-experiences/unified-checkout-redirection'
rules:
- id: provider.paymob.iframe_src.1
  version: 1
  signal_type: iframe_src
  pattern: accept.paymob.com
  weight: 0.7
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: Accept iframe host not confirmed
- id: provider.paymob.network_host.1
  version: 2
  signal_type: network_host
  pattern: accept.paymob.com
  weight: 0.6
  page_scope: checkout
  enabled: true
- id: provider.paymob.network_host.2
  version: 1
  signal_type: network_host
  pattern: accept.paymobsolutions.com
  weight: 0.5
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: legacy host not confirmed
- id: provider.paymob.script_src.1
  version: 1
  signal_type: script_src
  pattern: npm/paymob-pixel@
  weight: 0.6
  page_scope: any
  enabled: true
  note: Pixel SDK is served from jsDelivr
- id: provider.paymob.network_host.3
  version: 1
  signal_type: network_host
  pattern: eg.checkout.paymob.com
  weight: 0.6
  page_scope: checkout
  enabled: true
- id: provider.paymob.network_host.4
  version: 1
  signal_type: network_host
  pattern: uae.checkout.paymob.com
  weight: 0.6
  page_scope: checkout
  enabled: true
- id: provider.paymob.network_host.5
  version: 1
  signal_type: network_host
  pattern: ksa.checkout.paymob.com
  weight: 0.6
  page_scope: checkout
  enabled: true
- id: provider.paymob.network_host.6
  version: 1
  signal_type: network_host
  pattern: om.checkout.paymob.com
  weight: 0.6
  page_scope: checkout
  enabled: true
- id: provider.paymob.network_host.7
  version: 1
  signal_type: network_host
  pattern: ksa.paymob.com
  weight: 0.5
  page_scope: checkout
  enabled: true
- id: provider.paymob.network_host.8
  version: 1
  signal_type: network_host
  pattern: uae.paymob.com
  weight: 0.5
  page_scope: checkout
  enabled: true
- id: provider.paymob.network_host.9
  version: 1
  signal_type: network_host
  pattern: oman.paymob.com
  weight: 0.5
  page_scope: checkout
  enabled: true
- id: provider.paymob.js_global.1
  version: 1
  signal_type: js_global
  pattern: Pixel
  weight: 0.2
  page_scope: any
  enabled: false
  needs_verification: true
  note: documented constructor, but too generic a global name
