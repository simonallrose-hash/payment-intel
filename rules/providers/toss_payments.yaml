# Detection rules for provider `toss_payments` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: toss_payments
source: 'https://docs.tosspayments.com/sdk/v2/js; verified: https://docs.tosspayments.com/guides/v2/get-started/llms-quick-reference'
rules:
- id: provider.toss_payments.js_global.1
  version: 1
  signal_type: js_global
  pattern: TossPayments
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.toss_payments.script_src.1
  version: 2
  signal_type: script_src
  pattern: js.tosspayments.com/v2/standard
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.toss_payments.network_host.1
  version: 1
  signal_type: network_host
  pattern: '*.tosspayments.com'
  weight: 0.4
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: hosts not listed in the SDK docs
- id: provider.toss_payments.script_src.2
  version: 1
  signal_type: script_src
  pattern: js.tosspayments.com/v1/payment-widget
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.toss_payments.network_host.2
  version: 1
  signal_type: network_host
  pattern: js.tosspayments.com
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.toss_payments.network_host.3
  version: 1
  signal_type: network_host
  pattern: api.tosspayments.com
  weight: 0.5
  page_scope: checkout
  enabled: true
