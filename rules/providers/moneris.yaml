# Detection rules for provider `moneris` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: moneris
source: https://developer.moneris.com/hosted-solutions/docs/setup-guide
rules:
- id: provider.moneris.script_src.1
  version: 1
  signal_type: script_src
  pattern: gateway.moneris.com/chktv2/
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.moneris.js_global.1
  version: 1
  signal_type: js_global
  pattern: monerisCheckout
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.moneris.network_host.1
  version: 1
  signal_type: network_host
  pattern: gateway.moneris.com
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.moneris.network_host.2
  version: 1
  signal_type: network_host
  pattern: gatewayt.moneris.com
  weight: 0.2
  page_scope: any
  enabled: true
  note: test
