# Detection rules for provider `payu` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: payu
source: https://developers.payu.com/
rules:
- id: provider.payu.network_host.1
  version: 1
  signal_type: network_host
  pattern: secure.payu.com
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.payu.network_host.2
  version: 1
  signal_type: network_host
  pattern: '*.payu.com'
  weight: 0.4
  page_scope: any
  enabled: true
- id: provider.payu.network_host.3
  version: 1
  signal_type: network_host
  pattern: '*.payu.in'
  weight: 0.4
  page_scope: any
  enabled: true
- id: provider.payu.network_host.4
  version: 1
  signal_type: network_host
  pattern: secure.snd.payu.com
  weight: 0.2
  page_scope: any
  enabled: true
  note: sandbox
- id: provider.payu.script_src.1
  version: 1
  signal_type: script_src
  pattern: secure.payu.com/javascript/sdk
  weight: 0.6
  page_scope: any
  enabled: false
  needs_verification: true
