# Detection rules for provider `bluesnap` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: bluesnap
source: https://developers.bluesnap.com/v8976-Tools/docs/hosted-payment-fields
rules:
- id: provider.bluesnap.script_src.1
  version: 1
  signal_type: script_src
  pattern: pay.bluesnap.com/web-sdk/
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.bluesnap.js_global.1
  version: 1
  signal_type: js_global
  pattern: bluesnap
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.bluesnap.network_host.1
  version: 1
  signal_type: network_host
  pattern: pay.bluesnap.com
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.bluesnap.network_host.2
  version: 1
  signal_type: network_host
  pattern: sandpay.bluesnap.com
  weight: 0.2
  page_scope: any
  enabled: true
  note: sandbox
- id: provider.bluesnap.iframe_src.1
  version: 1
  signal_type: iframe_src
  pattern: pay.bluesnap.com
  weight: 0.6
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: docs say fields are iframes but do not name the host
