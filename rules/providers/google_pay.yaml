# Detection rules for provider `google_pay` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: google_pay
source: https://developers.google.com/pay/api/web/guides/tutorial
rules:
- id: provider.google_pay.script_src.1
  version: 1
  signal_type: script_src
  pattern: pay.google.com/gp/p/js/pay.js
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.google_pay.js_global.1
  version: 1
  signal_type: js_global
  pattern: google.payments.api.PaymentsClient
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.google_pay.network_host.1
  version: 1
  signal_type: network_host
  pattern: pay.google.com
  weight: 0.6
  page_scope: checkout
  enabled: true
- id: provider.google_pay.checkout_label.1
  version: 1
  signal_type: checkout_label
  pattern: (?i)google\s*pay|\bg\s*pay\b
  weight: 0.4
  page_scope: checkout
  enabled: true
