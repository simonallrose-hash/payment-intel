# Detection rules for provider `sumup` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: sumup
source: 'https://developer.sumup.com/online-payments/; verified: https://developer.sumup.com/online-payments/tools/card-widget'
rules:
- id: provider.sumup.network_host.1
  version: 1
  signal_type: network_host
  pattern: gateway.sumup.com
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.sumup.network_host.2
  version: 1
  signal_type: network_host
  pattern: api.sumup.com
  weight: 0.6
  page_scope: checkout
  enabled: true
- id: provider.sumup.network_host.3
  version: 1
  signal_type: network_host
  pattern: '*.sumup.com'
  weight: 0.4
  page_scope: any
  enabled: true
- id: provider.sumup.script_src.1
  version: 2
  signal_type: script_src
  pattern: gateway.sumup.com/gateway/ecom/card/v2/sdk.js
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.sumup.js_global.1
  version: 2
  signal_type: js_global
  pattern: SumUpCard
  weight: 0.5
  page_scope: any
  enabled: true
