# Detection rules for provider `recurly` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: recurly
source: https://github.com/recurly/recurly-js (official SDK) and https://docs.recurly.com/
rules:
- id: provider.recurly.script_src.1
  version: 1
  signal_type: script_src
  pattern: js.recurly.com/v4/recurly.js
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.recurly.network_host.1
  version: 1
  signal_type: network_host
  pattern: js.recurly.com
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.recurly.js_global.1
  version: 1
  signal_type: js_global
  pattern: recurly
  weight: 0.5
  page_scope: any
  enabled: false
  needs_verification: true
  note: global name not stated in the README
- id: provider.recurly.network_host.2
  version: 1
  signal_type: network_host
  pattern: api.recurly.com
  weight: 0.4
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: runtime API host not stated
