# Detection rules for provider `pay_nl` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: pay_nl
source: https://developer.pay.nl/
rules:
- id: provider.pay_nl.network_host.1
  version: 1
  signal_type: network_host
  pattern: static.pay.nl
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.pay_nl.network_host.2
  version: 1
  signal_type: network_host
  pattern: '*.pay.nl'
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.pay_nl.network_host.3
  version: 1
  signal_type: network_host
  pattern: rest-api.pay.nl
  weight: 0.6
  page_scope: checkout
  enabled: false
  needs_verification: true
