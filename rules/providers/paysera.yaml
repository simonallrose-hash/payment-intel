# Detection rules for provider `paysera` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: paysera
source: 'https://docs.paysera.com/en/checkout/integration; verified: https://developers.paysera.com/guides/checkout-classic/getting-started/making-your-first-payment/custom-integration'
rules:
- id: provider.paysera.form_action.1
  version: 2
  signal_type: form_action
  pattern: www.paysera.com
  weight: 0.7
  page_scope: checkout
  enabled: true
  note: checkout form posts to www.paysera.com/pay/
- id: provider.paysera.network_host.1
  version: 2
  signal_type: network_host
  pattern: www.paysera.com
  weight: 0.4
  page_scope: checkout
  enabled: true
