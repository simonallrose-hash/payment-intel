# Detection rules for provider `cybersource` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: cybersource
source: https://developer.cybersource.com/
rules:
- id: provider.cybersource.network_host.1
  version: 1
  signal_type: network_host
  pattern: secureacceptance.cybersource.com
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.cybersource.network_host.2
  version: 1
  signal_type: network_host
  pattern: flex.cybersource.com
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.cybersource.network_host.3
  version: 1
  signal_type: network_host
  pattern: '*.cybersource.com'
  weight: 0.4
  page_scope: any
  enabled: true
- id: provider.cybersource.script_src.1
  version: 1
  signal_type: script_src
  pattern: flex.cybersource.com/microform
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.cybersource.js_global.1
  version: 1
  signal_type: js_global
  pattern: Flex
  weight: 0.3
  page_scope: any
  enabled: true
