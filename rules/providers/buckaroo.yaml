# Detection rules for provider `buckaroo` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: buckaroo
source: https://docs.buckaroo.io/
rules:
- id: provider.buckaroo.network_host.1
  version: 1
  signal_type: network_host
  pattern: checkout.buckaroo.nl
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.buckaroo.network_host.2
  version: 1
  signal_type: network_host
  pattern: '*.buckaroo.nl'
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.buckaroo.network_host.3
  version: 1
  signal_type: network_host
  pattern: '*.buckaroo.io'
  weight: 0.3
  page_scope: any
  enabled: true
