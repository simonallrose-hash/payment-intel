# Detection rules for provider `pagar_me` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: pagar_me
source: 'https://docs.pagar.me/; verified: https://assets.pagar.me/checkout/1.1.0/checkout.js (official script: window.PagarMeCheckout) and https://docs.pagar.me/reference/checkout-2'
rules:
- id: provider.pagar_me.script_src.1
  version: 2
  signal_type: script_src
  pattern: assets.pagar.me/checkout/
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.pagar_me.js_global.1
  version: 2
  signal_type: js_global
  pattern: PagarMeCheckout
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.pagar_me.network_host.1
  version: 2
  signal_type: network_host
  pattern: api.pagar.me
  weight: 0.5
  page_scope: checkout
  enabled: true
