# Detection rules for provider `payplug` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: payplug
source: https://docs.payplug.com/
rules:
- id: provider.payplug.script_src.1
  version: 1
  signal_type: script_src
  pattern: cdn.payplug.com/js/integrated-payment/
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.payplug.js_global.1
  version: 1
  signal_type: js_global
  pattern: Payplug
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.payplug.network_host.1
  version: 1
  signal_type: network_host
  pattern: cdn.payplug.com
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.payplug.network_host.2
  version: 1
  signal_type: network_host
  pattern: secure.payplug.com
  weight: 0.6
  page_scope: checkout
  enabled: true
