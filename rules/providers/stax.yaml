# Detection rules for provider `stax` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: stax
source: https://docs.staxpayments.com/docs/overview-of-staxjs
rules:
- id: provider.stax.script_src.1
  version: 1
  signal_type: script_src
  pattern: staxjs.staxpayments.com/
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.stax.js_global.1
  version: 1
  signal_type: js_global
  pattern: StaxJs
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.stax.network_host.1
  version: 1
  signal_type: network_host
  pattern: staxjs.staxpayments.com
  weight: 0.6
  page_scope: any
  enabled: true
