# Detection rules for provider `paysafe` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: paysafe
source: https://developer.paysafe.com/
rules:
- id: provider.paysafe.network_host.1
  version: 1
  signal_type: network_host
  pattern: '*.paysafe.com'
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.paysafe.network_host.2
  version: 1
  signal_type: network_host
  pattern: '*.paysafecard.com'
  weight: 0.4
  page_scope: any
  enabled: true
- id: provider.paysafe.script_src.1
  version: 1
  signal_type: script_src
  pattern: hosted.paysafe.com/js/v1/latest/paysafe.min.js
  weight: 0.6
  page_scope: any
  enabled: false
  needs_verification: true
- id: provider.paysafe.js_global.1
  version: 1
  signal_type: js_global
  pattern: paysafe
  weight: 0.4
  page_scope: any
  enabled: false
  needs_verification: true
