# Detection rules for provider `mercado_pago` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: mercado_pago
source: https://www.mercadopago.com/developers/en/docs/sdks-library/client-side/mp-js-v2
rules:
- id: provider.mercado_pago.script_src.1
  version: 1
  signal_type: script_src
  pattern: sdk.mercadopago.com/js/v2
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.mercado_pago.js_global.1
  version: 1
  signal_type: js_global
  pattern: MercadoPago
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.mercado_pago.network_host.1
  version: 1
  signal_type: network_host
  pattern: api.mercadopago.com
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.mercado_pago.network_host.2
  version: 1
  signal_type: network_host
  pattern: '*.mercadopago.com'
  weight: 0.4
  page_scope: any
  enabled: true
