# Detection rules for provider `worldpay` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: worldpay
source: https://developer.worldpay.com/
rules:
- id: provider.worldpay.network_host.1
  version: 1
  signal_type: network_host
  pattern: '*.worldpay.com'
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.worldpay.network_host.2
  version: 1
  signal_type: network_host
  pattern: access.worldpay.com
  weight: 0.7
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: Access Worldpay checkout SDK host
- id: provider.worldpay.script_src.1
  version: 1
  signal_type: script_src
  pattern: access.worldpay.com/access-checkout
  weight: 0.6
  page_scope: any
  enabled: false
  needs_verification: true
- id: provider.worldpay.network_host.3
  version: 1
  signal_type: network_host
  pattern: secure.worldpay.com
  weight: 0.6
  page_scope: any
  enabled: false
  needs_verification: true
  note: legacy hosted pages
