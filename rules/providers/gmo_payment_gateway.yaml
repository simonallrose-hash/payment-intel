# Detection rules for provider `gmo_payment_gateway` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: gmo_payment_gateway
source: https://developer.gmo-pg.com/ (not reachable; verify)
rules:
- id: provider.gmo_payment_gateway.script_src.1
  version: 1
  signal_type: script_src
  pattern: static.mul-pay.jp/ext/js/token.js
  weight: 0.7
  page_scope: any
  enabled: false
  needs_verification: true
  note: token script path not confirmed
- id: provider.gmo_payment_gateway.js_global.1
  version: 1
  signal_type: js_global
  pattern: Multipayment
  weight: 0.6
  page_scope: any
  enabled: false
  needs_verification: true
  note: global name not confirmed
- id: provider.gmo_payment_gateway.network_host.1
  version: 1
  signal_type: network_host
  pattern: '*.mul-pay.jp'
  weight: 0.5
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: hosts not confirmed
