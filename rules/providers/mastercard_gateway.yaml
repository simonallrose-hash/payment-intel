# Detection rules for provider `mastercard_gateway` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: mastercard_gateway
source: https://developer.mastercard.com/mastercard-gateway/documentation/build/hosted-checkout/integrate-hosted-checkout/implementing-the-hosted-payment-page/
rules:
- id: provider.mastercard_gateway.script_src.1
  version: 1
  signal_type: script_src
  pattern: /static/checkout/checkout.min.js
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.mastercard_gateway.js_global.1
  version: 1
  signal_type: js_global
  pattern: Checkout
  weight: 0.2
  page_scope: any
  enabled: false
  needs_verification: true
  note: too generic a global name
- id: provider.mastercard_gateway.network_host.1
  version: 1
  signal_type: network_host
  pattern: '*.gateway.mastercard.com'
  weight: 0.5
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: regional gateway hosts are not listed in the docs
