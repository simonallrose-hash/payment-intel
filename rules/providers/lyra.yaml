# Detection rules for provider `lyra` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: lyra
source: 'https://docs.lyra.com/en/rest/V4.0/javascript/; verified: https://www.npmjs.com/package/@lyracom/embedded-form-glue (official package: window.KR, static.lyra.com) and https://github.com/lyra/embedded-form-glue'
rules:
- id: provider.lyra.script_src.1
  version: 2
  signal_type: script_src
  pattern: /static/js/krypton-client/V4.0/
  weight: 0.7
  page_scope: any
  enabled: true
  note: Krypton client path not confirmed
- id: provider.lyra.js_global.1
  version: 2
  signal_type: js_global
  pattern: KR
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.lyra.network_host.1
  version: 2
  signal_type: network_host
  pattern: static.lyra.com
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.lyra.network_host.2
  version: 1
  signal_type: network_host
  pattern: static.payzen.eu
  weight: 0.5
  page_scope: any
  enabled: false
  needs_verification: true
  note: host not confirmed
- id: provider.lyra.network_host.3
  version: 1
  signal_type: network_host
  pattern: secure.payzen.eu
  weight: 0.6
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: hosted page host not confirmed
- id: provider.lyra.script_src.2
  version: 1
  signal_type: script_src
  pattern: kr-payment-form.min.js
  weight: 0.5
  page_scope: any
  enabled: true
