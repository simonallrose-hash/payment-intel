# Detection rules for provider `stancer` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: stancer
source: 'https://www.stancer.com/en/documentation/; verified: https://www.stancer.com/documentation/api/ (payment page at payment.stancer.com)'
rules:
- id: provider.stancer.network_host.1
  version: 1
  signal_type: network_host
  pattern: '*.stancer.com'
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.stancer.network_host.2
  version: 1
  signal_type: network_host
  pattern: api.stancer.com
  weight: 0.7
  page_scope: checkout
  enabled: false
  needs_verification: true
- id: provider.stancer.network_host.3
  version: 1
  signal_type: network_host
  pattern: js.stancer.com
  weight: 0.5
  page_scope: any
  enabled: false
  needs_verification: true
- id: provider.stancer.iframe_src.1
  version: 1
  signal_type: iframe_src
  pattern: payment.stancer.com
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.stancer.network_host.4
  version: 1
  signal_type: network_host
  pattern: payment.stancer.com
  weight: 0.6
  page_scope: checkout
  enabled: true
