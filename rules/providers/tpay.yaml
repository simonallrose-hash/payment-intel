# Detection rules for provider `tpay` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: tpay
source: 'https://docs.tpay.com/; verified: https://docs-api.tpay.com/en/payment-methods/cards/ (secure.tpay.com is the transactionPaymentUrl host)'
rules:
- id: provider.tpay.form_action.1
  version: 1
  signal_type: form_action
  pattern: secure.tpay.com
  weight: 0.7
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: form target not confirmed
- id: provider.tpay.network_host.1
  version: 2
  signal_type: network_host
  pattern: secure.tpay.com
  weight: 0.5
  page_scope: checkout
  enabled: true
- id: provider.tpay.network_host.2
  version: 1
  signal_type: network_host
  pattern: secure.sandbox.tpay.com
  weight: 0.2
  page_scope: any
  enabled: false
  needs_verification: true
  note: sandbox host not confirmed
