# Detection rules for provider `dojo` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: dojo
source: https://docs.dojo.tech/ (not reachable; verify)
rules:
- id: provider.dojo.script_src.1
  version: 1
  signal_type: script_src
  pattern: web.e.dojo.tech/js/dojo-web-sdk
  weight: 0.7
  page_scope: any
  enabled: false
  needs_verification: true
  note: web SDK script not confirmed
- id: provider.dojo.js_global.1
  version: 1
  signal_type: js_global
  pattern: DojoWebSDK
  weight: 0.6
  page_scope: any
  enabled: false
  needs_verification: true
  note: global name not confirmed
- id: provider.dojo.network_host.1
  version: 1
  signal_type: network_host
  pattern: '*.e.dojo.tech'
  weight: 0.5
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: hosts not confirmed
