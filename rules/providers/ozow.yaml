# Detection rules for provider `ozow` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: ozow
source: 'https://docs.ozow.com/; verified: https://oldhub.ozow.com/docs/step-post-from-merchant-website'
rules:
- id: provider.ozow.form_action.1
  version: 2
  signal_type: form_action
  pattern: pay.ozow.com
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.ozow.network_host.1
  version: 2
  signal_type: network_host
  pattern: pay.ozow.com
  weight: 0.6
  page_scope: checkout
  enabled: true
