# Detection rules for provider `woopayments` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: woopayments
source: 'https://wordpress.org/plugins/woocommerce-payments/; verified: https://github.com/Automattic/woocommerce-payments (official plugin: woocommerce-payments.php, wp_localize_script ''wcpay_upe_config'' in includes/class-wc-payments-checkout.php)'
rules:
- id: provider.woopayments.platform_plugin.1
  version: 2
  signal_type: platform_plugin
  pattern: /wp-content/plugins/woocommerce-payments/
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.woopayments.js_global.1
  version: 2
  signal_type: js_global
  pattern: wcpay_upe_config
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.woopayments.js_global.2
  version: 1
  signal_type: js_global
  pattern: wcpayCustomerData
  weight: 0.4
  page_scope: any
  enabled: true
