# Detection rules for provider `woopayments` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: woopayments
source: https://wordpress.org/plugins/woocommerce-payments/ (plugin path; verify asset names)
rules:
- id: provider.woopayments.platform_plugin.1
  version: 1
  signal_type: platform_plugin
  pattern: /wp-content/plugins/woocommerce-payments/
  weight: 0.7
  page_scope: any
  enabled: false
  needs_verification: true
  note: plugin asset path not confirmed on a live shop
- id: provider.woopayments.js_global.1
  version: 1
  signal_type: js_global
  pattern: wcpayConfig
  weight: 0.5
  page_scope: any
  enabled: false
  needs_verification: true
  note: global name not confirmed
