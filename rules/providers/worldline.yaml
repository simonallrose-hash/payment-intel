# Detection rules for provider `worldline` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: worldline
source: https://docs.direct.worldline-solutions.com/ and https://saferpay.github.io/
rules:
- id: provider.worldline.network_host.1
  version: 1
  signal_type: network_host
  pattern: secure.ogone.com
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.worldline.network_host.2
  version: 1
  signal_type: network_host
  pattern: '*.ogone.com'
  weight: 0.4
  page_scope: any
  enabled: true
- id: provider.worldline.network_host.3
  version: 1
  signal_type: network_host
  pattern: www.saferpay.com
  weight: 0.6
  page_scope: checkout
  enabled: true
- id: provider.worldline.network_host.4
  version: 1
  signal_type: network_host
  pattern: test.saferpay.com
  weight: 0.2
  page_scope: any
  enabled: true
  note: test
- id: provider.worldline.network_host.5
  version: 1
  signal_type: network_host
  pattern: '*.worldline-solutions.com'
  weight: 0.5
  page_scope: any
  enabled: false
  needs_verification: true
  note: Worldline Direct hosts
- id: provider.worldline.network_host.6
  version: 1
  signal_type: network_host
  pattern: payment.worldline.com
  weight: 0.6
  page_scope: any
  enabled: false
  needs_verification: true
