# Detection rules for provider `2c2p` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: 2c2p
source: https://developer.2c2p.com/ (not reachable; verify)
rules:
- id: provider.2c2p.script_src.1
  version: 1
  signal_type: script_src
  pattern: 2c2p.com/sdk/javascript/
  weight: 0.6
  page_scope: any
  enabled: false
  needs_verification: true
  note: SDK script path not confirmed
- id: provider.2c2p.js_global.1
  version: 1
  signal_type: js_global
  pattern: My2c2p
  weight: 0.6
  page_scope: any
  enabled: false
  needs_verification: true
  note: global name not confirmed
- id: provider.2c2p.network_host.1
  version: 1
  signal_type: network_host
  pattern: '*.2c2p.com'
  weight: 0.4
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: hosts not confirmed
