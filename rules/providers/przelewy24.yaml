# Detection rules for provider `przelewy24` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: przelewy24
source: https://developers.przelewy24.pl/
rules:
- id: provider.przelewy24.network_host.1
  version: 1
  signal_type: network_host
  pattern: secure.przelewy24.pl
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.przelewy24.network_host.2
  version: 1
  signal_type: network_host
  pattern: go.przelewy24.pl
  weight: 0.6
  page_scope: checkout
  enabled: true
- id: provider.przelewy24.network_host.3
  version: 1
  signal_type: network_host
  pattern: '*.przelewy24.pl'
  weight: 0.4
  page_scope: any
  enabled: true
