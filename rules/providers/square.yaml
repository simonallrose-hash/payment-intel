# Detection rules for provider `square` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: square
source: https://developer.squareup.com/docs/web-payments/overview
rules:
- id: provider.square.script_src.1
  version: 1
  signal_type: script_src
  pattern: web.squarecdn.com/v1/square.js
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.square.script_src.2
  version: 1
  signal_type: script_src
  pattern: sandbox.web.squarecdn.com
  weight: 0.2
  page_scope: any
  enabled: true
  note: sandbox
- id: provider.square.js_global.1
  version: 1
  signal_type: js_global
  pattern: Square
  weight: 0.4
  page_scope: any
  enabled: true
- id: provider.square.network_host.1
  version: 1
  signal_type: network_host
  pattern: web.squarecdn.com
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.square.network_host.2
  version: 1
  signal_type: network_host
  pattern: pci-connect.squareup.com
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.square.network_host.3
  version: 1
  signal_type: network_host
  pattern: '*.squareup.com'
  weight: 0.3
  page_scope: any
  enabled: true
