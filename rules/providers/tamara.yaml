# Detection rules for provider `tamara` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: tamara
source: 'https://docs.tamara.co/docs/direct-widgets; verified: https://cdn.tamara.co/widget-v2/tamara-widget.js (official widget bundle: window.TamaraWidgetV2, custom element tamara-widget) and https://docs.tamara.co/docs/direct-widgets.md'
rules:
- id: provider.tamara.script_src.1
  version: 2
  signal_type: script_src
  pattern: cdn.tamara.co/widget-v2/
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.tamara.js_global.1
  version: 2
  signal_type: js_global
  pattern: TamaraWidgetV2
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.tamara.html_pattern.1
  version: 2
  signal_type: html_pattern
  pattern: <tamara-widget
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.tamara.network_host.1
  version: 1
  signal_type: network_host
  pattern: checkout.tamara.co
  weight: 0.6
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: checkout host not confirmed
- id: provider.tamara.network_host.2
  version: 1
  signal_type: network_host
  pattern: cdn.tamara.co
  weight: 0.5
  page_scope: any
  enabled: true
