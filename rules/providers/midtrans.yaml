# Detection rules for provider `midtrans` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: midtrans
source: https://docs.midtrans.com/reference/frontend-integration
rules:
- id: provider.midtrans.script_src.1
  version: 1
  signal_type: script_src
  pattern: app.midtrans.com/snap/snap.js
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.midtrans.network_host.1
  version: 1
  signal_type: network_host
  pattern: app.midtrans.com
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.midtrans.network_host.2
  version: 1
  signal_type: network_host
  pattern: app.sandbox.midtrans.com
  weight: 0.2
  page_scope: any
  enabled: true
  note: sandbox
- id: provider.midtrans.js_global.1
  version: 1
  signal_type: js_global
  pattern: snap
  weight: 0.2
  page_scope: any
  enabled: false
  needs_verification: true
  note: too generic a global name
