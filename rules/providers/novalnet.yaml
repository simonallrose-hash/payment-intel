# Detection rules for provider `novalnet` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: novalnet
source: https://developer.novalnet.de/
rules:
- id: provider.novalnet.network_host.1
  version: 1
  signal_type: network_host
  pattern: paygate.novalnet.de
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.novalnet.network_host.2
  version: 1
  signal_type: network_host
  pattern: '*.novalnet.de'
  weight: 0.4
  page_scope: any
  enabled: true
- id: provider.novalnet.network_host.3
  version: 1
  signal_type: network_host
  pattern: '*.novalnet.com'
  weight: 0.3
  page_scope: any
  enabled: true
