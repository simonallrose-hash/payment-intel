# Detection rules for provider `fiserv` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: fiserv
source: https://developer.fiserv.com/
rules:
- id: provider.fiserv.network_host.1
  version: 1
  signal_type: network_host
  pattern: www.ipg-online.com
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.fiserv.network_host.2
  version: 1
  signal_type: network_host
  pattern: '*.ipg-online.com'
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.fiserv.network_host.3
  version: 1
  signal_type: network_host
  pattern: '*.firstdata.com'
  weight: 0.4
  page_scope: any
  enabled: true
- id: provider.fiserv.network_host.4
  version: 1
  signal_type: network_host
  pattern: '*.fiserv.com'
  weight: 0.3
  page_scope: any
  enabled: true
- id: provider.fiserv.network_host.5
  version: 1
  signal_type: network_host
  pattern: api.fiserv.com
  weight: 0.6
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: Commerce Hub
