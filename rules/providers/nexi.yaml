# Detection rules for provider `nexi` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: nexi
source: https://developer.nexi.it/ and https://developer.nexigroup.com/nexi-checkout/
rules:
- id: provider.nexi.network_host.1
  version: 1
  signal_type: network_host
  pattern: ecommerce.nexi.it
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.nexi.network_host.2
  version: 1
  signal_type: network_host
  pattern: '*.nexi.it'
  weight: 0.4
  page_scope: any
  enabled: true
- id: provider.nexi.network_host.3
  version: 1
  signal_type: network_host
  pattern: checkout.dibspayment.eu
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.nexi.script_src.1
  version: 1
  signal_type: script_src
  pattern: checkout.dibspayment.eu/v1/checkout.js
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.nexi.js_global.1
  version: 1
  signal_type: js_global
  pattern: Dibs
  weight: 0.4
  page_scope: any
  enabled: false
  needs_verification: true
  note: Nets Easy global object
