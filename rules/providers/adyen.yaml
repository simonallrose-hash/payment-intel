# Detection rules for provider `adyen` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: adyen
source: https://docs.adyen.com/online-payments/build-your-integration/
rules:
- id: provider.adyen.script_src.1
  version: 1
  signal_type: script_src
  pattern: checkoutshopper-live.adyen.com
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.adyen.js_global.1
  version: 1
  signal_type: js_global
  pattern: AdyenCheckout
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.adyen.network_host.1
  version: 1
  signal_type: network_host
  pattern: checkoutshopper-live.adyen.com
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.adyen.network_host.2
  version: 1
  signal_type: network_host
  pattern: checkoutshopper-test.adyen.com
  weight: 0.3
  page_scope: checkout
  enabled: true
  note: test environment
- id: provider.adyen.iframe_src.1
  version: 1
  signal_type: iframe_src
  pattern: checkoutshopper-live.adyen.com
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.adyen.network_host.3
  version: 1
  signal_type: network_host
  pattern: '*.adyen.com'
  weight: 0.3
  page_scope: any
  enabled: true
