# Detection rules for provider `cashfree` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: cashfree
source: https://docs.cashfree.com/docs/javascript-integration (code blocks not reachable; verify)
rules:
- id: provider.cashfree.script_src.1
  version: 1
  signal_type: script_src
  pattern: sdk.cashfree.com/js/v3/cashfree.js
  weight: 0.7
  page_scope: any
  enabled: false
  needs_verification: true
  note: script path not confirmed
- id: provider.cashfree.js_global.1
  version: 1
  signal_type: js_global
  pattern: Cashfree
  weight: 0.6
  page_scope: any
  enabled: false
  needs_verification: true
  note: global name not confirmed
- id: provider.cashfree.network_host.1
  version: 1
  signal_type: network_host
  pattern: '*.cashfree.com'
  weight: 0.3
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: hosts not confirmed
