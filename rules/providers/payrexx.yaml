# Detection rules for provider `payrexx` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: payrexx
source: https://developers.payrexx.com/docs/modal-window
rules:
- id: provider.payrexx.script_src.1
  version: 1
  signal_type: script_src
  pattern: media.payrexx.com/modal/v1/modal.min.js
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.payrexx.network_host.1
  version: 1
  signal_type: network_host
  pattern: media.payrexx.com
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.payrexx.network_host.2
  version: 1
  signal_type: network_host
  pattern: '*.payrexx.com'
  weight: 0.4
  page_scope: checkout
  enabled: true
  note: merchant instance host
- id: provider.payrexx.iframe_src.1
  version: 1
  signal_type: iframe_src
  pattern: '*.payrexx.com'
  weight: 0.6
  page_scope: checkout
  enabled: true
- id: provider.payrexx.js_global.1
  version: 1
  signal_type: js_global
  pattern: payrexxModal
  weight: 0.3
  page_scope: any
  enabled: false
  needs_verification: true
  note: jQuery plugin method, not a window global
