# Detection rules for provider `xendit` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: xendit
source: 'https://docs.xendit.co/; verified: https://www.npmjs.com/package/xendit-components-web (official package README) and https://docs.xendit.co/docs/components-overview.md'
rules:
- id: provider.xendit.script_src.1
  version: 1
  signal_type: script_src
  pattern: js.xendit.co/v1/xendit.min.js
  weight: 0.7
  page_scope: any
  enabled: false
  needs_verification: true
  note: script path not confirmed
- id: provider.xendit.js_global.1
  version: 1
  signal_type: js_global
  pattern: Xendit
  weight: 0.6
  page_scope: any
  enabled: false
  needs_verification: true
  note: global name not confirmed
- id: provider.xendit.network_host.1
  version: 1
  signal_type: network_host
  pattern: checkout.xendit.co
  weight: 0.6
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: invoice page host not confirmed
- id: provider.xendit.script_src.2
  version: 1
  signal_type: script_src
  pattern: assets.xendit.co/components/
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.xendit.network_host.2
  version: 1
  signal_type: network_host
  pattern: assets.xendit.co
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.xendit.network_host.3
  version: 1
  signal_type: network_host
  pattern: checkout-ui-gateway.xendit.co
  weight: 0.5
  page_scope: checkout
  enabled: true
  note: host inside the official components SDK bundle
