# Detection rules for provider `paytrail` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: paytrail
source: https://docs.paytrail.com/ (hosts not on the index page; verify)
rules:
- id: provider.paytrail.network_host.1
  version: 1
  signal_type: network_host
  pattern: services.paytrail.com
  weight: 0.6
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: API host not confirmed
- id: provider.paytrail.network_host.2
  version: 1
  signal_type: network_host
  pattern: pay.paytrail.com
  weight: 0.6
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: payment page host not confirmed
- id: provider.paytrail.form_action.1
  version: 1
  signal_type: form_action
  pattern: pay.paytrail.com
  weight: 0.7
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: form target not confirmed
