# Detection rules for provider `nuvei` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: nuvei
source: https://docs.nuvei.com/documentation/accept-payment/web-sdk/quick-start/
rules:
- id: provider.nuvei.script_src.1
  version: 1
  signal_type: script_src
  pattern: cdn.safecharge.com/safecharge_resources/v1/websdk/safecharge.js
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.nuvei.js_global.1
  version: 1
  signal_type: js_global
  pattern: SafeCharge
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.nuvei.network_host.1
  version: 1
  signal_type: network_host
  pattern: cdn.safecharge.com
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.nuvei.network_host.2
  version: 1
  signal_type: network_host
  pattern: '*.safecharge.com'
  weight: 0.4
  page_scope: checkout
  enabled: true
- id: provider.nuvei.network_host.3
  version: 1
  signal_type: network_host
  pattern: '*.nuvei.com'
  weight: 0.3
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: checkout API host not in the Web SDK docs
