# Detection rules for provider `rapyd` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: rapyd
source: https://docs.rapyd.net/
rules:
- id: provider.rapyd.network_host.1
  version: 1
  signal_type: network_host
  pattern: '*.rapyd.net'
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.rapyd.network_host.2
  version: 1
  signal_type: network_host
  pattern: checkouttoolkit.rapyd.net
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.rapyd.js_global.1
  version: 1
  signal_type: js_global
  pattern: RapydCheckoutToolkit
  weight: 0.5
  page_scope: any
  enabled: false
  needs_verification: true
