# Detection rules for provider `hipay` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: hipay
source: https://developer.hipay.com/doc/hipay-enterprise-sdk-js_3
rules:
- id: provider.hipay.script_src.1
  version: 1
  signal_type: script_src
  pattern: libs.hipay.com/js/sdkjs.js
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.hipay.js_global.1
  version: 1
  signal_type: js_global
  pattern: HiPay
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.hipay.network_host.1
  version: 1
  signal_type: network_host
  pattern: libs.hipay.com
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.hipay.network_host.2
  version: 1
  signal_type: network_host
  pattern: '*.hipay-tpp.com'
  weight: 0.6
  page_scope: checkout
  enabled: true
- id: provider.hipay.network_host.3
  version: 1
  signal_type: network_host
  pattern: stage-libs.hipay.com
  weight: 0.2
  page_scope: any
  enabled: true
  note: staging
- id: provider.hipay.iframe_src.1
  version: 1
  signal_type: iframe_src
  pattern: '*.hipay.com'
  weight: 0.5
  page_scope: checkout
  enabled: true
  note: CSP frame-src in the docs
