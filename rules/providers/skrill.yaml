# Detection rules for provider `skrill` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: skrill
source: https://www.skrill.com/fileadmin/content/pdf/Skrill_Quick_Checkout_Guide.pdf
rules:
- id: provider.skrill.form_action.1
  version: 1
  signal_type: form_action
  pattern: pay.skrill.com
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.skrill.network_host.1
  version: 1
  signal_type: network_host
  pattern: pay.skrill.com
  weight: 0.6
  page_scope: checkout
  enabled: true
