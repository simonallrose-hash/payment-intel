# Detection rules for provider `cielo` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: cielo
source: https://developercielo.github.io/manual/cielo-ecommerce
rules:
- id: provider.cielo.network_host.1
  version: 1
  signal_type: network_host
  pattern: api.cieloecommerce.cielo.com.br
  weight: 0.5
  page_scope: checkout
  enabled: true
- id: provider.cielo.network_host.2
  version: 1
  signal_type: network_host
  pattern: apisandbox.cieloecommerce.cielo.com.br
  weight: 0.2
  page_scope: any
  enabled: true
  note: sandbox
- id: provider.cielo.script_src.1
  version: 1
  signal_type: script_src
  pattern: transaction.cieloecommerce.cielo.com.br/post/scripts/silentorderpost
  weight: 0.7
  page_scope: any
  enabled: false
  needs_verification: true
  note: Silent Order Post script not on the fetched page
- id: provider.cielo.network_host.3
  version: 1
  signal_type: network_host
  pattern: '*.cieloecommerce.cielo.com.br'
  weight: 0.4
  page_scope: checkout
  enabled: false
  needs_verification: true
  note: wider suffix not confirmed
