# Detection rules for provider `global_payments` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: global_payments
source: https://developer.globalpay.com/
rules:
- id: provider.global_payments.script_src.1
  version: 1
  signal_type: script_src
  pattern: js.globalpay.com
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.global_payments.js_global.1
  version: 1
  signal_type: js_global
  pattern: GlobalPayments
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.global_payments.network_host.1
  version: 1
  signal_type: network_host
  pattern: '*.globalpay.com'
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.global_payments.network_host.2
  version: 1
  signal_type: network_host
  pattern: pay.realexpayments.com
  weight: 0.6
  page_scope: checkout
  enabled: true
- id: provider.global_payments.network_host.3
  version: 1
  signal_type: network_host
  pattern: '*.realexpayments.com'
  weight: 0.4
  page_scope: any
  enabled: true
