# Detection rules for provider `viva_wallet` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: viva_wallet
source: https://developer.vivawallet.com/
rules:
- id: provider.viva_wallet.network_host.1
  version: 1
  signal_type: network_host
  pattern: www.vivapayments.com
  weight: 0.7
  page_scope: checkout
  enabled: true
- id: provider.viva_wallet.network_host.2
  version: 1
  signal_type: network_host
  pattern: demo.vivapayments.com
  weight: 0.2
  page_scope: any
  enabled: true
  note: demo
- id: provider.viva_wallet.network_host.3
  version: 1
  signal_type: network_host
  pattern: '*.vivapayments.com'
  weight: 0.5
  page_scope: any
  enabled: true
- id: provider.viva_wallet.network_host.4
  version: 1
  signal_type: network_host
  pattern: '*.viva.com'
  weight: 0.3
  page_scope: any
  enabled: true
