# Detection rules for provider `satispay` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: provider
target_id: satispay
source: https://developers.satispay.com/docs/web-button-pay
rules:
- id: provider.satispay.script_src.1
  version: 1
  signal_type: script_src
  pattern: online.satispay.com/web-button.js
  weight: 0.7
  page_scope: any
  enabled: true
- id: provider.satispay.js_global.1
  version: 1
  signal_type: js_global
  pattern: SatispayWebButton
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.satispay.network_host.1
  version: 1
  signal_type: network_host
  pattern: online.satispay.com
  weight: 0.6
  page_scope: any
  enabled: true
- id: provider.satispay.network_host.2
  version: 1
  signal_type: network_host
  pattern: staging.online.satispay.com
  weight: 0.2
  page_scope: any
  enabled: true
  note: sandbox
