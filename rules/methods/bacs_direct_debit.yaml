# Detection rules for payment_method `bacs_direct_debit` (FR-DT-01, FR-DT-02; FR-DT-03 local method set).
# Checkout-label rules match the brand name as shown to the buyer (ADR-0015); the brand's
# official site is the `source`. Rules with needs_verification: true are disabled.
target_type: payment_method
target_id: bacs_direct_debit
source: https://www.bacs.co.uk/
rules:
- id: payment_method.bacs_direct_debit.checkout_label.1
  version: 1
  signal_type: checkout_label
  pattern: '(?i)\bbacs\b|^(?!.*\bsepa\b).*\bdirect\s+debit\b'
  weight: 0.4
  page_scope: checkout
  enabled: true
  note: 'UK; ''Direct Debit'' without SEPA'
