# Detection rules for payment_method `crypto_generic` (FR-DT-01, FR-DT-02; FR-DT-03 local method set).
# Checkout-label rules match the brand name as shown to the buyer (ADR-0015); the brand's
# official site is the `source`. Rules with needs_verification: true are disabled.
target_type: payment_method
target_id: crypto_generic
source: https://en.wikipedia.org/wiki/Cryptocurrency
rules:
- id: payment_method.crypto_generic.checkout_label.1
  version: 1
  signal_type: checkout_label
  pattern: '(?i)\b(bitcoin|btc|ethereum|crypto(currency|currencies|-?w[äa]hrung)?|coinbase|bitpay|usdt|usdc)\b'
  weight: 0.4
  page_scope: checkout
  enabled: true
  note: 'generic; the processor (BitPay/Coinbase Commerce) is a provider'
