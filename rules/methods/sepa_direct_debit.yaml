# Detection rules for payment_method `sepa_direct_debit` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: payment_method
target_id: sepa_direct_debit
rules:
- id: payment_method.sepa_direct_debit.checkout_label.1
  version: 1
  signal_type: checkout_label
  pattern: (?i)sepa.{0,20}(lastschrift|direct\s*debit|incasso)
  weight: 0.5
  page_scope: checkout
  enabled: true
