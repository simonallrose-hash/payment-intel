# Detection rules for payment_method `klarna` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: payment_method
target_id: klarna
source: https://docs.klarna.com/
rules:
- id: payment_method.klarna.script_src.1
  version: 1
  signal_type: script_src
  pattern: x.klarnacdn.net/kp/lib/v1/api.js
  weight: 0.5
  page_scope: any
  enabled: true
- id: payment_method.klarna.iframe_src.1
  version: 1
  signal_type: iframe_src
  pattern: '*.klarna.com'
  weight: 0.6
  page_scope: checkout
  enabled: true
- id: payment_method.klarna.checkout_label.1
  version: 1
  signal_type: checkout_label
  pattern: (?i)klarna
  weight: 0.5
  page_scope: checkout
  enabled: true
