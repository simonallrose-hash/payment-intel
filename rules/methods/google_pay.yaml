# Detection rules for payment_method `google_pay` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: payment_method
target_id: google_pay
source: https://developers.google.com/pay/api/web
rules:
- id: payment_method.google_pay.script_src.1
  version: 1
  signal_type: script_src
  pattern: pay.google.com/gp/p/js/pay.js
  weight: 0.5
  page_scope: any
  enabled: true
- id: payment_method.google_pay.checkout_label.1
  version: 1
  signal_type: checkout_label
  pattern: (?i)google\s*pay
  weight: 0.5
  page_scope: checkout
  enabled: true
