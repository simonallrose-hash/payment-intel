# Detection rules for payment_method `open_banking` (FR-DT-01, FR-DT-02; FR-DT-03 local method set).
# Checkout-label rules match the brand name as shown to the buyer (ADR-0015); the brand's
# official site is the `source`. Rules with needs_verification: true are disabled.
target_type: payment_method
target_id: open_banking
source: https://www.openbanking.org.uk/
rules:
- id: payment_method.open_banking.checkout_label.1
  version: 1
  signal_type: checkout_label
  pattern: '(?i)\bopen\s+banking\b|pay\s+by\s+bank(\s+app)?|\binstant\s+bank\s+transfer\b|\bbank\s+app\b'
  weight: 0.4
  page_scope: checkout
  enabled: true
  note: 'account-to-account via open banking; ''Pay by Bank'''
