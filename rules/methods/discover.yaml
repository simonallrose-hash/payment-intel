# Detection rules for payment_method `discover` (FR-DT-01, FR-DT-02; FR-DT-03 local method set).
# Checkout-label rules match the brand name as shown to the buyer (ADR-0015); the brand's
# official site is the `source`. Rules with needs_verification: true are disabled.
target_type: payment_method
target_id: discover
source: https://www.discover.com/
rules:
- id: payment_method.discover.checkout_label.1
  version: 1
  signal_type: checkout_label
  pattern: '(?i)\bdiscover\b(?!\s+(more|our|the|new|all))'
  weight: 0.4
  page_scope: checkout
  enabled: true
  note: 'US card scheme; the word also appears in navigation — payment labels only'
