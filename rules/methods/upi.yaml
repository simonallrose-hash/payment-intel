# Detection rules for payment_method `upi` (FR-DT-01, FR-DT-02; FR-DT-03 local method set).
# Checkout-label rules match the brand name as shown to the buyer (ADR-0015); the brand's
# official site is the `source`. Rules with needs_verification: true are disabled.
target_type: payment_method
target_id: upi
source: https://www.npci.org.in/what-we-do/upi/product-overview
rules:
- id: payment_method.upi.checkout_label.1
  version: 1
  signal_type: checkout_label
  pattern: '(?i)\bupi\b|\bbhim\b|\bgoogle\s?pay\s*\(?upi'
  weight: 0.5
  page_scope: checkout
  enabled: true
  note: 'IN real-time payments (NPCI)'
