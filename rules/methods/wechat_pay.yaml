# Detection rules for payment_method `wechat_pay` (FR-DT-01, FR-DT-02; FR-DT-03 local method set).
# Checkout-label rules match the brand name as shown to the buyer (ADR-0015); the brand's
# official site is the `source`. Rules with needs_verification: true are disabled.
target_type: payment_method
target_id: wechat_pay
source: https://pay.weixin.qq.com/
rules:
- id: payment_method.wechat_pay.checkout_label.1
  version: 1
  signal_type: checkout_label
  pattern: '(?i)\bwe\s?chat\s?pay\b|\b微信支付\b'
  weight: 0.5
  page_scope: checkout
  enabled: true
