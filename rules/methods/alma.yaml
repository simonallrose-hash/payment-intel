# Detection rules for payment_method `alma` (FR-DT-01, FR-DT-02; FR-DT-03 local method set).
# Checkout-label rules match the brand name as shown to the buyer (ADR-0015); the brand's
# official site is the `source`. Rules with needs_verification: true are disabled.
target_type: payment_method
target_id: alma
source: https://almapay.com/
rules:
- id: payment_method.alma.checkout_label.1
  version: 1
  signal_type: checkout_label
  pattern: '(?i)\balma\b'
  weight: 0.4
  page_scope: checkout
  enabled: true
  note: 'FR BNPL; label ''Payer en 3 fois avec Alma'''
