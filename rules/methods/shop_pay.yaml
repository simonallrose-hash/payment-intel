# Detection rules for payment_method `shop_pay` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: payment_method
target_id: shop_pay
source: https://shop.app/
rules:
- id: payment_method.shop_pay.network_host.1
  version: 1
  signal_type: network_host
  pattern: shop.app
  weight: 0.5
  page_scope: checkout
  enabled: true
- id: payment_method.shop_pay.checkout_label.1
  version: 1
  signal_type: checkout_label
  pattern: (?i)shop\s*pay
  weight: 0.5
  page_scope: checkout
  enabled: true
