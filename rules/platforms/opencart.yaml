# Detection rules for platform `opencart` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: platform
target_id: opencart
source: https://docs.opencart.com/
rules:
- id: platform.opencart.html_pattern.1
  version: 1
  signal_type: html_pattern
  pattern: index\.php\?route=(product|common|checkout|account)/
  weight: 0.7
  page_scope: any
  enabled: true
- id: platform.opencart.cookie.1
  version: 1
  signal_type: cookie
  pattern: OCSESSID
  weight: 0.6
  page_scope: any
  enabled: true
