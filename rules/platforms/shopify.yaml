# Detection rules for platform `shopify` (FR-DT-01, FR-DT-02).
# Signatures come from the provider's official documentation (see `source`);
# rules with needs_verification: true are disabled until confirmed (brief rule 8).
target_type: platform
target_id: shopify
source: https://shopify.dev/
rules:
- id: platform.shopify.network_host.1
  version: 1
  signal_type: network_host
  pattern: cdn.shopify.com
  weight: 0.6
  page_scope: any
  enabled: true
- id: platform.shopify.js_global.1
  version: 1
  signal_type: js_global
  pattern: Shopify
  weight: 0.5
  page_scope: any
  enabled: true
- id: platform.shopify.html_pattern.1
  version: 1
  signal_type: html_pattern
  pattern: cdn\.shopify\.com
  weight: 0.5
  page_scope: any
  enabled: true
- id: platform.shopify.cookie.1
  version: 1
  signal_type: cookie
  pattern: _shopify_y
  weight: 0.5
  page_scope: any
  enabled: true
- id: platform.shopify.cookie.2
  version: 1
  signal_type: cookie
  pattern: _shopify_s
  weight: 0.4
  page_scope: any
  enabled: true
- id: platform.shopify.header.1
  version: 1
  signal_type: header
  pattern: x-shopid
  weight: 0.6
  page_scope: any
  enabled: true
- id: platform.shopify.header.2
  version: 1
  signal_type: header
  pattern: x-shopify-stage
  weight: 0.6
  page_scope: any
  enabled: true
