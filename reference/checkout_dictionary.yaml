# Checkout vocabulary in the 10 languages of FR-CW-03 (EN, DE, FR, NL, ES, IT, PL, PT, SV, DA).
#
# `final_actions` is the dictionary of FR-CW-04: a control whose text, aria-label,
# value, title, alt, name or id matches any phrase is a "place order / pay / buy"
# action and is NEVER clicked by the scanner. `final_markers` are attribute
# fragments (ids, classes, names, data-* values, form actions) that identify the
# same controls when they carry no readable text. Matching is done on normalised
# text (NFKC, lower-case, punctuation and extra whitespace removed); a phrase
# matches when it equals the text or is contained in it as whole words.
#
# `step_actions` are the only buttons the walk may press to move between
# checkout steps (FR-CW-02). A control that matches both lists is ambiguous and
# is not clicked (guardrail_ambiguous_button).
