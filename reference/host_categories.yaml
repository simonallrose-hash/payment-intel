# Categories of third-party hosts on the checkout page (FR-DT-11): analytics,
# ads, cdn, tag_manager, session_replay, chat. PSP hosts are not listed here:
# they come from the enabled provider rules (`network_host`, `script_src`,
# `iframe_src`), so the category `psp` always follows the rule set. Everything
# else is `unknown`. Suffix match on the hostname (eTLD+1 or deeper).
