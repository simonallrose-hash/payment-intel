# Hosted checkout pages of payment providers (ADR-0032). A shop that sends the
# buyer to one of these hosts for the whole checkout has no checkout of its own
# on its eTLD+1: the walk never navigates there (ADR-0014 p. 9) but recognises
# the host — in a cart → checkout link or as the landing host after a redirect —
# and stops with `checkout/hosted_checkout_external`, attributing the provider.
#
# Every `verified` entry cites the official page that names the host. Hosts
# that could not be confirmed stay `needs_verification` and are ignored by the
# matcher (same discipline as detection rules, brief rule 8). `path_prefix`
# narrows the match when the host also serves other things (an API host).
# Only hosts of *providers* (reference/providers.yaml) belong here; Shopify's
# checkout has run on the shop's own domain since 2017-07-20
# (https://shopify.dev/changelog/checkouts-will-occur-at-the-shop-domain-instead-of-checkout-shopify-com),
# so it is a platform adapter case, not a hosted checkout.
version: 1
hosts:
  - host: checkout.stripe.com
    provider_id: stripe
    status: verified
    source: https://docs.stripe.com/api/checkout/sessions/object
    note: "Checkout Session `url` uses checkout.stripe.com unless a custom domain is set"
  - host: buy.stripe.com
    provider_id: stripe
    status: verified
    source: https://docs.stripe.com/api/payment-link/object
    note: "Payment Links (`submit_type` pay/subscribe)"
