# Production composition (AS-17): one compose file, services split across
# servers by `profiles` (app-1, crawl-1, data-1). Secrets come from `.env`
# (NFR-S-06). `app-1` runs the stores, the reverse proxy, the API/portal
# (`api`), the alert dispatcher (`notifier`) and the export/opt-out worker
# (`exporter`); `crawl-1` runs the scanners; `data-1` ClickHouse and MinIO.
name: payintel

x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: payintel-app:latest
  env_file: .env
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  caddy:
    profiles: [app-1]
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    environment:
      API_UPSTREAM: api:8000
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}   # hostname → ACME; "localhost" → internal CA (NFR-S-01)
    networks: [edge]

  postgres:
    profiles: [app-1]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: payintel
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payintel -d payintel"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [app]

  redis:
    profiles: [app-1]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    networks: [app]

  clickhouse:
    profiles: [data-1]
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: payintel
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
      CLICKHOUSE_DB: payintel
    volumes:
      - ch-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    networks: [data]

  minio:
    profiles: [data-1]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - minio-data:/data
    networks: [data]

  unbound:
    profiles: [crawl-1]
    image: mvance/unbound:1.21.1
    restart: unless-stopped
    volumes:
      - ./docker/unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    networks: [crawl]

  migrate:
    <<: *app
    profiles: [app-1]
    restart: "no"
    command: ["payintel", "migrate"]
    networks: [app]

  api:
    <<: *app
    profiles: [app-1]
    command: ["payintel", "api", "serve", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    expose: ["8000"]
    environment:
      PAYINTEL_API__COOKIE_SECURE: "true"
    depends_on: [postgres, redis]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 1g }
    networks: [edge, app]

  notifier:
    <<: *app
    profiles: [app-1]
    command: ["payintel", "alerts", "dispatch", "--interval", "30"]
    depends_on: [postgres]
    deploy:
      resources:
        limits: { memory: 512m }
    networks: [app]

  exporter:
    <<: *app
    profiles: [app-1]
    command: ["payintel", "exports", "run", "--interval", "60"]
    depends_on: [postgres]
    deploy:
      resources:
        limits: { memory: 4g }   # 1M-row Parquet snapshot peaks at ~3.2 GB (capacity.md §3, NFR-P-06)
    networks: [app]

  audit-verify:
    <<: *app
    profiles: [app-1]
    # NFR-S-11: the hash chain of audit_log is verified daily; a break is logged loudly
    # and the alert rule in runbook §6 fires on that line.
    command: ["sh", "-c", "while true; do payintel audit verify || echo 'AUDIT CHAIN BROKEN'; sleep 86400; done"]
    depends_on: [postgres]
    deploy:
      resources:
        limits: { memory: 256m }
    networks: [app]

  worker-light:
    <<: *app
    profiles: [crawl-1]
    command: ["payintel", "worker-light", "--worker-id", "crawl-1-light"]
    environment:
      PAYINTEL_DISCOVERY__DNS_NAMESERVERS: '["unbound"]'
      PAYINTEL_DISCOVERY__DNS_PORT: "53"
    depends_on: [unbound]
    deploy:
      resources:
        limits: { memory: 2g }
    networks: [crawl]

  browser:
    # NFR-S-08: Chromium lives in its own container; the worker talks to it over
    # the Playwright protocol (ws://browser:3000/) and never runs a browser itself.
    # No secrets, no database access, only the crawl network.
    profiles: [crawl-1]
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: checkout
    image: payintel-checkout:latest
    command: ["playwright", "run-server", "--host", "0.0.0.0", "--port", "3000"]
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
    user: payintel
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    shm_size: 1g            # Chromium renderers share memory via /dev/shm
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 50m, max-file: "5" } }
    deploy:
      resources:
        limits: { memory: 6g }   # 8 contexts × ≤1 GB JS-heap guard + browser
    networks: [crawl]

  worker-checkout:
    <<: *app
    profiles: [crawl-1]
    command: ["payintel", "worker-checkout", "--worker-id", "crawl-1-checkout"]
    environment:
      PAYINTEL_DISCOVERY__DNS_NAMESERVERS: '["unbound"]'
      PAYINTEL_DISCOVERY__DNS_PORT: "53"
      PAYINTEL_CHECKOUT__BROWSER_WS_ENDPOINT: ws://browser:3000/
    depends_on: [unbound, browser]
    deploy:
      resources:
        limits: { memory: 1g }   # walker + HAR buffers only; Chromium is in `browser`
    networks: [crawl, app, data]

volumes:
  pg-data:
  ch-data:
  minio-data:
  caddy-data:

# NFR-S-08: three segments per server. `edge` is the only one with published ports (Caddy);
# `app` carries Postgres/Redis and the application services; `crawl` holds the scanners and
# the browsers, which reach only Unbound here and, across servers, the queue (Postgres),
# the limiter (Redis), MinIO and ClickHouse through the host firewall (runbook §1).
networks:
  edge:
  app:
  crawl:
  data:
